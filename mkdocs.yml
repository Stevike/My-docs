
site_name: Ikechukwu Okonkwo | Technical Documentation
site_description: Technical writing portfolio featuring wellhead engineering documentation, technical guides, and API documentation.
site_url: https://stevike.github.io/My-docs/
site_author: Ikechukwu Okonkwo

repo_url: https://github.com/Stevike/My-docs
repo_name: GitHub

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight

  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

nav:
  - Home: index.md
  - Wellhead Documentation: Guide.md
  - Technical Guide: Guide2.md
  - API Reference: api-guide.md

copyright: Copyright &copy; 2026 Ikechukwu

extra_css:
  - styles/extra.css

extra:
  generator: false